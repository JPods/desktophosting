<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1240" width="1600" height="1240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Desktop Publishing, again — Desktop Hosting on a Mac mini</title>
  <desc>Apple gave the individual the press in 1985. WebClerk on a Mac mini gives the individual the store in 2026.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L11 6 L1 11 z" fill="#0A66FF"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L11 6 L1 11 z" fill="#8A94A1"/>
    </marker>
  </defs>

  <g id="ground">
    <rect x="0" y="0" width="1600" height="1240" fill="#FFFFFF"/>
  </g>

  <!-- ─────────────────────────── headline ─────────────────────────── -->
  <g id="headline">
    <text x="90" y="98" font-size="15" font-weight="700" letter-spacing="3.4" fill="#0A66FF">THE SECOND TIME APPLE PUTS THE MEANS OF PRODUCTION ON A DESK</text>

    <text x="90" y="176" font-size="54" font-weight="700" fill="#0B0E12">Desktop Publishing gave the individual the press.</text>
    <text x="90" y="240" font-size="54" font-weight="700" fill="#0B0E12">Desktop <tspan fill="#0A66FF">Hosting</tspan> gives the individual the store.</text>

    <text x="90" y="292" font-size="22" fill="#5A6572">One Mac mini. Free, open-source software. Every business its own server — not a tenant on somebody else's.</text>

    <line x1="90" y1="336" x2="1510" y2="336" stroke="#D5DBE2" stroke-width="1"/>
  </g>

  <!-- ─────────────────────────── the two eras ─────────────────────────── -->
  <g id="era-1985">
    <text x="90" y="392" font-size="14" font-weight="700" letter-spacing="2.6" fill="#0A66FF">1985 — IT WORKED</text>
    <text x="90" y="440" font-size="32" font-weight="700" fill="#0B0E12">Desktop Publishing</text>
    <text x="90" y="476" font-size="19" fill="#5A6572">Macintosh + LaserWriter + PageMaker</text>

    <text x="90" y="530" font-size="13" font-weight="700" letter-spacing="2.2" fill="#8A94A1">WHO STOPPED BEING ASKED PERMISSION</text>

    <g font-size="20" fill="#5A6572">
      <text x="90" y="568">Typesetters</text>
      <line x1="88" y1="562" x2="199" y2="562" stroke="#C2362B" stroke-width="2"/>
      <text x="90" y="604">Print shops</text>
      <line x1="88" y1="598" x2="196" y2="598" stroke="#C2362B" stroke-width="2"/>
      <text x="90" y="640">Publishers who chose who got printed</text>
      <line x1="88" y1="634" x2="448" y2="634" stroke="#C2362B" stroke-width="2"/>
    </g>

    <text x="90" y="700" font-size="22" font-weight="700" fill="#0B0E12">Anyone with a desk could publish.</text>
    <text x="90" y="732" font-size="18" fill="#5A6572">Apple sold the machine that sat on it.</text>
  </g>

  <line x1="800" y1="370" x2="800" y2="745" stroke="#D5DBE2" stroke-width="1"/>

  <g id="era-2026">
    <text x="850" y="392" font-size="14" font-weight="700" letter-spacing="2.6" fill="#0A66FF">2026 — IT IS THE SAME MOVE</text>
    <text x="850" y="440" font-size="32" font-weight="700" fill="#0B0E12">Desktop Hosting</text>
    <text x="850" y="476" font-size="19" fill="#5A6572">Mac mini + WebClerk + Cloudflare</text>

    <text x="850" y="530" font-size="13" font-weight="700" letter-spacing="2.2" fill="#8A94A1">WHO STOPS BEING ASKED PERMISSION</text>

    <g font-size="20" fill="#5A6572">
      <text x="850" y="568">Platform rent, every month, forever</text>
      <line x1="848" y1="562" x2="1180" y2="562" stroke="#C2362B" stroke-width="2"/>
      <text x="850" y="604">Marketplaces that own the customer list</text>
      <line x1="848" y1="598" x2="1228" y2="598" stroke="#C2362B" stroke-width="2"/>
      <text x="850" y="640">Terms of service that can change on Tuesday</text>
      <line x1="848" y1="634" x2="1272" y2="634" stroke="#C2362B" stroke-width="2"/>
    </g>

    <text x="850" y="700" font-size="22" font-weight="700" fill="#0B0E12">Anyone with a desk can run a business.</text>
    <text x="850" y="732" font-size="18" fill="#5A6572">Apple sells the machine that sits on it.</text>
  </g>

  <line x1="90" y1="782" x2="1510" y2="782" stroke="#D5DBE2" stroke-width="1"/>

  <!-- ─────────────────────────── how it runs ─────────────────────────── -->
  <g id="how-it-runs">
    <text x="90" y="826" font-size="13" font-weight="700" letter-spacing="2.2" fill="#8A94A1">HOW IT RUNS</text>
    <text x="1510" y="826" font-size="13" font-weight="700" letter-spacing="2.2" fill="#0A66FF" text-anchor="end">34 MILLION U.S. SMALL BUSINESSES · ONE BOX EACH</text>

    <!-- inputs -->
    <g font-size="17" fill="#5A6572">
      <text x="90" y="892">The counter</text>
      <text x="90" y="920">The phone</text>
      <text x="90" y="948">The web order</text>
    </g>
    <line x1="228" y1="918" x2="330" y2="918" stroke="#8A94A1" stroke-width="2" marker-end="url(#arrow-grey)"/>

    <!-- sovereignty boundary -->
    <rect x="352" y="846" width="636" height="176" rx="10" fill="#F5F8FC" stroke="#0A66FF" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="368" y="874" font-size="12.5" font-weight="700" letter-spacing="2" fill="#0A66FF">ON HARDWARE THE OWNER OWNS · CUSTOMERS · PRICES · BOOKS</text>

    <!-- the machine -->
    <g id="mac-mini">
      <rect x="376" y="890" width="258" height="112" rx="16" fill="#FFFFFF" stroke="#0B0E12" stroke-width="2"/>
        <text x="505" y="938" font-size="24" font-weight="700" fill="#0B0E12" text-anchor="middle">Mac mini</text>
      <text x="505" y="966" font-size="15" fill="#5A6572" text-anchor="middle">from $599, once</text>
    </g>

    <!-- what runs on it -->
    <g id="stack" font-size="15" fill="#0B0E12">
      <rect x="660" y="890" width="308" height="30" rx="5" fill="#FFFFFF" stroke="#D5DBE2"/>
      <text x="674" y="910">WebClerk — free, open source</text>
      <rect x="660" y="928" width="308" height="30" rx="5" fill="#FFFFFF" stroke="#D5DBE2"/>
      <text x="674" y="948">PostgreSQL — the business's own records</text>
      <rect x="660" y="966" width="308" height="30" rx="5" fill="#FFFFFF" stroke="#D5DBE2"/>
      <text x="674" y="986">Alice — the agent that watches the books</text>
    </g>

    <!-- out to the world -->
    <line x1="1000" y1="934" x2="1078" y2="934" stroke="#0A66FF" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1039" y="918" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#0A66FF" text-anchor="middle">OUTBOUND</text>

    <rect x="1092" y="898" width="196" height="72" rx="10" fill="#FFFFFF" stroke="#0B0E12" stroke-width="1.5"/>
    <text x="1190" y="928" font-size="18" font-weight="700" fill="#0B0E12" text-anchor="middle">Cloudflare tunnel</text>
    <text x="1190" y="952" font-size="14" fill="#5A6572" text-anchor="middle">no open ports</text>

    <line x1="1300" y1="934" x2="1378" y2="934" stroke="#0A66FF" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="1392" y="928" font-size="19" font-weight="700" fill="#0B0E12">Customers,</text>
    <text x="1392" y="954" font-size="19" font-weight="700" fill="#0B0E12">anywhere</text>

    <text x="352" y="1050" font-size="16" fill="#5A6572">Unplug the network and the business still runs. Unplug the platform and a tenant has nothing.</text>
  </g>

  <line x1="90" y1="1086" x2="1510" y2="1086" stroke="#D5DBE2" stroke-width="1"/>

  <!-- ─────────────────────────── the three words ─────────────────────────── -->
  <g id="principles">
    <g>
      <text x="90" y="1130" font-size="19" font-weight="700" letter-spacing="1.6" fill="#0B0E12">SOVEREIGNTY</text>
      <text x="90" y="1158" font-size="16" fill="#5A6572">The records live on the owner's</text>
      <text x="90" y="1180" font-size="16" fill="#5A6572">machine. Nobody else's terms.</text>
    </g>
    <g>
      <text x="565" y="1130" font-size="19" font-weight="700" letter-spacing="1.6" fill="#0B0E12">CONTROL</text>
      <text x="565" y="1158" font-size="16" fill="#5A6572">Own the prices, the customer list,</text>
      <text x="565" y="1180" font-size="16" fill="#5A6572">the books — and the off switch.</text>
    </g>
    <g>
      <text x="1040" y="1130" font-size="19" font-weight="700" letter-spacing="1.6" fill="#0B0E12">EMPOWERMENT</text>
      <text x="1040" y="1158" font-size="16" fill="#5A6572">The software is free. The only thing</text>
      <text x="1040" y="1180" font-size="16" fill="#5A6572">left to buy is the computer.</text>
    </g>
  </g>

  <g id="closing">
    <text x="90" y="1224" font-size="19" font-style="italic" font-family="Georgia, Times New Roman, serif" fill="#0B0E12">In 1984 the hammer was a metaphor. Desktop Hosting is the hammer, and it costs $599.</text>
    <text x="1510" y="1224" font-size="14" fill="#8A94A1" text-anchor="end">webclerk.com/desktophosting · JPods · Bill James</text>
  </g>
</svg>
